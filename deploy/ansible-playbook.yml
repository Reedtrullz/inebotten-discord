- name: Deploy Inebotten through the shared verified code deployment contract
  hosts: vps
  gather_facts: false
  vars:
    compose_dir: "/opt/apps/inebotten-discord"
    deployment_profile: compose-host-caddy
    first_install: false

  tasks:
    - name: Refuse a dirty existing source checkout before synchronization
      ansible.builtin.command: git status --porcelain --untracked-files=normal
      args:
        chdir: "{{ compose_dir }}"
      become: true
      become_user: deploy
      register: source_status
      changed_when: false
      failed_when: source_status.rc != 0 or source_status.stdout | length > 0

    - name: Pull latest source from origin
      ansible.builtin.git:
        repo: "https://github.com/Reedtrullz/inebotten-discord.git"
        dest: "{{ compose_dir }}"
        version: master
        update: true
        force: false
      become: true
      become_user: deploy
      register: source_pull

    - name: Read checked-out full source revision
      ansible.builtin.command: git rev-parse HEAD
      args:
        chdir: "{{ compose_dir }}"
      become: true
      become_user: deploy
      register: source_commit
      changed_when: false

    - name: Inspect the provisioned data directory without changing existing ownership
      ansible.builtin.stat:
        path: "{{ compose_dir }}/data"
        follow: false
      register: data_directory

    - name: Require reviewed non-root data provisioning
      ansible.builtin.assert:
        that:
          - data_directory.stat.isdir | default(false)
          - not (data_directory.stat.islnk | default(false))
          - data_directory.stat.uid | default(-1) == 10001
        fail_msg: "Provision data UID 10001 explicitly; existing files are not recursively chowned."

    - name: Build tracked source and apply with full revision readiness and compatible rollback
      ansible.builtin.command:
        argv: "{{ ['python3', 'scripts/inebotten_deploy.py', '--repo', compose_dir, '--profile', deployment_profile, '--build', '--apply'] + (['--first-install'] if first_install | bool else []) }}"
      args:
        chdir: "{{ compose_dir }}"
      become: true
      become_user: deploy
      register: deployment_result
      changed_when: true

    - name: Report the verified code deployment receipt
      ansible.builtin.debug:
        msg: "{{ deployment_result.stdout }}"
