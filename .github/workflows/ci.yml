name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements/*.in
            requirements/*.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/dev.lock

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Type-check the incremental contracts
        run: >-
          python -m mypy --follow-imports=silent --ignore-missing-imports
          tests/test_dependency_profiles.py

      - name: Check for syntax errors and undefined names
        run: |
          python -m flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,.superpowers

      - name: Compile Python files
        run: |
          python -m compileall \
            -q \
            -x '(^|/)(\.git|\.superpowers|__pycache__|\.pytest_cache)(/|$)' \
            .

      - name: Run tests
        run: |
          python scripts/run_offline_tests.py --python python -- -q --ignore=tests/test_console_frontend.py --ignore=tests/test_web_console_frontend_security.py
          python scripts/run_offline_tests.py --python python -- -q tests/test_console_frontend.py tests/test_web_console_frontend_security.py

      - name: Check for committed secrets
        run: |
          if git grep -n -E 'M[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{20,}' -- '*.py' '*.env' '*.md' '*.yml' '*.yaml'; then
            echo "Potential hardcoded secret found. Use environment variables instead."
            exit 1
          fi

          if find . \( -name '.env' -o -name '.env.bak' -o -path './data/*' \) | grep -q .; then
            echo "Sensitive local data file found in the repository."
            exit 1
          fi

  windows-storage:
    name: Windows store ownership
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Verify Windows single-writer locking and preservation
        run: python scripts/run_offline_tests.py --python python -- -q tests/test_storage_concurrency.py tests/test_storage_outcomes.py


  dependency-profiles:
    name: Install profiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install every lock in a clean Python 3.12 environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import venv

          root = Path.cwd()
          profiles = (
              "prod", "dev", "desktop", "optional-google",
              "optional-search", "optional-browser",
          )
          base = root / ".profile-venvs"
          for profile in profiles:
              env_dir = base / profile
              venv.EnvBuilder(with_pip=True).create(env_dir)
              python = env_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              lock = root / "requirements" / f"{profile}.lock"
              subprocess.run(
                  [str(python), "-m", "pip", "install", "--require-hashes", "-r", str(lock)],
                  check=True,
              )
              if profile == "dev":
                  dev_python = python

          subprocess.run(
              [str(dev_python), "scripts/run_offline_tests.py", "--python", str(dev_python),
               "--", "tests/test_dependency_profiles.py", "-q"],
              check=True,
          )
          subprocess.run(
              [str(dev_python), "-m", "mypy", "--follow-imports=silent",
               "--ignore-missing-imports", "tests/test_dependency_profiles.py"],
              check=True,
          )
          PY
