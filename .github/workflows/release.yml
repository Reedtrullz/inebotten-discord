name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: Full CI on the selected release ref
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.ref }}
    permissions:
      contents: read

  build_desktop:
    name: Required CI, platform builds, and frozen smoke checks
    uses: ./.github/workflows/build-desktop-apps.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit
    permissions:
      contents: read

  verify_macos_signing:
    name: Verify macOS Developer ID signing and notarization
    needs: build_desktop
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
    steps:
      - name: Download the macOS release artifact
        if: env.APPLE_CERTIFICATE_P12 != ''
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: artifacts/macos

      - name: Verify Developer ID signature and notarization staple
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          unzip -q artifacts/macos/Inebotten-macos.zip -d artifacts/macos/extracted
          bundle=$(find artifacts/macos/extracted -type d -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$bundle"
          stapler validate "$bundle"

  publish:
    name: Verify artifacts and publish release
    needs: [ci, build_desktop, verify_macos_signing]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download macOS proof
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: artifacts/macos

      - name: Download Windows proof
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/windows

      - name: Verify ref, commit, assets, lock, and checksums
        env:
          RELEASE_REF: ${{ github.ref }}
        run: >-
          python scripts/release_contract.py verify-artifacts
          --ref "$RELEASE_REF"
          --commit "$(git rev-parse HEAD)"
          --macos-dir artifacts/macos
          --windows-dir artifacts/windows
          --output-dir artifacts

      - name: Publish the verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            artifacts/macos/Inebotten-macos.zip
            artifacts/macos/Inebotten-release-macos.json
            artifacts/macos/Inebotten-smoke-macos.json
            artifacts/windows/Inebotten-windows.zip
            artifacts/windows/Inebotten-release-windows.json
            artifacts/windows/Inebotten-smoke-windows.json
            artifacts/SHA256SUMS
          )
          release_args=(--verify-tag --title "Inebotten $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}"
