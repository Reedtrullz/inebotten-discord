name: Build Desktop Apps

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build (blank uses the selected workflow ref)
        required: false
        type: string
      version:
        description: Optional expected version; must match the selected ref
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  contract-tests:
    name: Release contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate selected ref and optional version
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: python scripts/release_contract.py validate-ref --ref "$RELEASE_REF" --version "$RELEASE_VERSION"

      - name: Run release contract tests
        run: python tests/test_release_contract.py

  build-desktop:
    name: Build and smoke test ${{ matrix.platform }}
    needs: contract-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create child-owned desktop environment
        run: python -m venv .superpowers/desktop-env

      - name: Install only the locked desktop profile from PyPI
        shell: bash
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'NUL' || '/dev/null' }}
          PIP_EXTRA_INDEX_URL: ''
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_NO_INDEX: '0'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON=.superpowers/desktop-env/Scripts/python.exe
          else
            PYTHON=.superpowers/desktop-env/bin/python
          fi
          "$PYTHON" -m pip install --disable-pip-version-check --require-hashes --index-url https://pypi.org/simple -r requirements/desktop.lock

      - name: Regress native macOS metadata and extracted signature integrity
        if: runner.os == 'macOS'
        run: python tests/test_release_contract.py

      - name: Rehearse native Tk and owned process shutdown without accounts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON=.superpowers/desktop-env/Scripts/python.exe
          else
            PYTHON=.superpowers/desktop-env/bin/python
          fi
          "$PYTHON" scripts/check_desktop_lifecycle.py

      - name: Build and smoke the selected platform artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_REF: ${{ inputs.ref || github.ref }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON=.superpowers/desktop-env/Scripts/python.exe
          else
            PYTHON=.superpowers/desktop-env/bin/python
          fi
          "$PYTHON" scripts/build_desktop.py "$PLATFORM" --ref "$RELEASE_REF" --version "$RELEASE_VERSION" --output-dir .superpowers/receipts/release

      - name: Preserve nonpublishing artifact proof
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: .superpowers/receipts/release/*
          if-no-files-found: error
          retention-days: 30

  verify-artifacts:
    name: Verify both artifacts with the publisher contract
    needs: build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download macOS proof
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: artifacts/macos

      - name: Download Windows proof
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/windows

      - name: Verify ref, commit, assets, lock, and checksums without publication
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: >-
          python scripts/release_contract.py verify-artifacts
          --ref "$RELEASE_REF"
          --commit "$(git rev-parse HEAD)"
          --macos-dir artifacts/macos
          --windows-dir artifacts/windows
          --output-dir artifacts

      - name: Preserve the small verified contract receipts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-contract-proof
          path: |
            artifacts/macos/*.json
            artifacts/windows/*.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
